<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | OmniLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-100 py-4 px-6 flex justify-between items-center max-w-4xl mx-auto w-full">
        <a href="{% url 'dashboard' %}" class="font-bold text-xl text-slate-900 tracking-tight">Omni<span class="text-emerald-600">Link</span></a>
        <a href="{% url 'dashboard' %}" class="text-sm font-medium text-slate-600 hover:text-slate-900">&larr; Back to Dashboard</a>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow max-w-lg mx-auto w-full p-4 my-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h1 class="text-xl font-bold text-slate-900 mb-1">Add New Product</h1>
            <p class="text-sm text-slate-500 mb-6">List an item on your public storefront catalog.</p>

            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                
                {% for field in form %}
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-rose-500 text-xs mt-1">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-sm mt-4">
                    Save Product
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-100">
        &copy; 2026 OmniLink. Empowering local commerce.
    </footer>

</body>
</html>
