<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | OmniLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 max-w-md w-full mx-4">
        <div class="text-center mb-6">
            <a href="{% url 'home' %}" class="font-bold text-2xl text-slate-900 tracking-tight">Omni<span class="text-emerald-600">Link</span></a>
            <h2 class="text-base font-semibold text-slate-700 mt-2">Create your vendor account</h2>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <p class="text-slate-400 text-xs mt-1">{{ field.help_text|safe }}</p>
                    {% endif %}
                    {% if field.errors %}
                        <p class="text-rose-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-sm mt-2">
                Sign Up
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an account? <a href="{% url 'login' %}" class="text-emerald-600 font-medium hover:underline">Log in</a>
        </p>
    </div>

</body>
</html>
